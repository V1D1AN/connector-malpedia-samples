name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install flake8 black isort pytest pytest-cov

      - name: Lint with flake8
        run: |
          flake8 src/ --max-line-length=120 --exclude=__pycache__

      - name: Check formatting with black
        run: |
          black --check --line-length=120 src/

      - name: Check imports with isort
        run: |
          isort --check-only --profile=black src/

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src/malpedia_samples --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t connector-malpedia-samples:ci .

  release:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/connector-malpedia-samples:${{ steps.version.outputs.VERSION }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/connector-malpedia-samples:${{ steps.version.outputs.VERSION }}
